services:
  mysql:
    image: mysql:8.0
    container_name: speedtest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - speedtest-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speedtest-app
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local
      IPINFO_TOKEN: ${IPINFO_TOKEN}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE}
      LOG_LEVEL: ${LOG_LEVEL}
      DEBUG: ${DEBUG}
      JWT_SECRET: ${JWT_SECRET}
      DEMO_API_KEY_ENABLED: ${DEMO_API_KEY_ENABLED}
      SERVER_URL: ${SERVER_URL}
      SWAGGER_HOST: ${SWAGGER_HOST}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - speedtest-network

volumes:
  mysql_data:
    driver: local

networks:
  speedtest-network:
    driver: bridge
